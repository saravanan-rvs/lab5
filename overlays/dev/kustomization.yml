apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev
namePrefix: dev-

resources:
  - ../../base
  - namespace.yaml

labels:
  - pairs:
      environment: dev
    includeTemplates: true

replicas:
  - name: webapp
    count: 1

configMapGenerator:
  - name: web-content
    behavior: replace
    files:
      - index.html

patches:
  - target:
      kind: Service
      name: webapp
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30081
