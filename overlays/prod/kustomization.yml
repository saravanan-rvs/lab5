apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod
namePrefix: prod-

resources:
  - ../../base
  - namespace.yaml

labels:
  - pairs:
      environment: prod
    includeTemplates: true

replicas:
  - name: webapp
    count: 3

images:
  - name: nginx
    newTag: "1.27"

configMapGenerator:
  - name: web-content
    behavior: replace
    files:
      - index.html

patches:
  - path: resources-patch.yaml
  - target:
      kind: Service
      name: webapp
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30082
